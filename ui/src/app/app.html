@if ($any(authService.isAuthenticated$ | async) === false) {
  <div class="container" style="margin-top: 15vh;">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-8 col-md-6 col-lg-4">
        <app-auth-login></app-auth-login>
      </div>
    </div>
  </div>
}

<div [class.d-none]="$any(authService.isAuthenticated$ | async) === false">
  
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-cloud-arrow-down-fill me-2" viewBox="0 0 16 16">
          <path d="M8 2a5.53 5.53 0 0 0-3.594 1.342c-.766.66-1.321 1.52-1.464 2.383C1.266 6.095 0 7.555 0 9.318 0 11.366 1.708 13 3.781 13h8.906C14.502 13 16 11.57 16 9.773c0-1.636-1.242-2.969-2.834-3.194C12.923 3.999 10.69 2 8 2zm2.354 6.854-2 2a.5.5 0 0 1-.708 0l-2-2a.5.5 0 1 1 .708-.708L7.5 9.293V5.5a.5.5 0 0 1 1 0v3.793l1.146-1.147a.5.5 0 0 1 .708.708z"/>
        </svg>
        MeTube
      </a>
      
      <div class="d-flex align-items-center ms-auto">
        @if ($any(authService.isAuthenticated$ | async)) {
          <span class="navbar-text me-3 text-light">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-circle me-1" viewBox="0 0 16 16">
              <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
              <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1z"/>
            </svg>
            <strong>{{ $any(authService.authUser$ | async)?.username }}</strong>
          </span>
          <button class="btn btn-outline-light btn-sm" (click)="authService.logout && authService.logout()">Logout</button>
        }
      </div>
    </div>
  </nav>

  @if (authService.isAdmin && authService.isAdmin()) {
    <div class="container-fluid mb-4">
      <app-auth-admin></app-auth-admin>
    </div>
  }

  <div class="container-fluid">
    
    <app-toast-container></app-toast-container>

    <div class="row">
      <div class="col-12 col-xl-4 mb-4">
        <app-downloading-section></app-downloading-section>
      </div>
      <div class="col-12 col-xl-4 mb-4">
        <app-completed-section></app-completed-section>
      </div>
      <div class="col-12 col-xl-4 mb-4">
        <app-subscriptions-section></app-subscriptions-section>
      </div>
    </div>
  </div>
</div>
