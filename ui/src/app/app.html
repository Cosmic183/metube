<div class="mat-typography app-root">
  <!-- TOP NAVIGATION BAR -->
  <mat-toolbar color="primary" class="mat-elevation-z4 header-toolbar">
    <div class="toolbar-container">
      <div class="brand">
        <mat-icon>cloud_download</mat-icon>
        <span class="app-title">MeTube</span>
      </div>
      
      <span class="spacer"></span>

      <!-- AUTHENTICATION NAVIGATION (Visible only when logged in) -->
      <ng-container *ngIf="authService.isAuthenticated$ | async">
        <span class="user-greeting">
          <mat-icon class="user-icon">account_circle</mat-icon>
          {{ (authService.authUser$ | async)?.username }}
        </span>
        <button mat-button class="logout-btn" (click)="authService.logout()">
          <mat-icon>exit_to_app</mat-icon>
          Logout
        </button>
      </ng-container>
    </div>
  </mat-toolbar>

  <!-- MAIN CONTENT AREA -->
  <div class="main-container">

    <!-- 1. LOGIN SCREEN -->
    <!-- Displayed ONLY when the user is explicitly NOT authenticated -->
    <!-- The strict '=== false' check satisfies the Angular linter -->
    <div *ngIf="(authService.isAuthenticated$ | async) === false" class="auth-wrapper">
      <app-auth-login></app-auth-login>
    </div>

    <!-- 2. PROTECTED APPLICATION AREA -->
    <!-- Hidden when the user is explicitly NOT authenticated -->
    <!-- The strict '=== false' check satisfies the Angular linter -->
    <div [class.d-none]="(authService.isAuthenticated$ | async) === false" class="app-wrapper">
      
      <!-- ADMIN PANEL -->
      <div class="admin-section" *ngIf="authService.isAdmin()">
        <app-auth-admin></app-auth-admin>
      </div>

      <!-- CORE METUBE INTERFACE -->
      <div class="content-section">
        
        <!-- Add Download Section -->
        <mat-card class="add-card mat-elevation-z2">
          <mat-card-content>
            <app-add></app-add>
          </mat-card-content>
        </mat-card>

        <!-- Main Tabbed Interface (Downloads, Subscriptions, History) -->
        <mat-card class="tabs-card mat-elevation-z2">
          <mat-tab-group animationDuration="150ms" dynamicHeight class="main-tabs">
            
            <mat-tab>
              <ng-template mat-tab-label>
                <mat-icon class="tab-icon">queue_play_next</mat-icon>
                <span>Downloads</span>
              </ng-template>
              <div class="tab-content">
                <app-queue></app-queue>
              </div>
            </mat-tab>

            <mat-tab>
              <ng-template mat-tab-label>
                <mat-icon class="tab-icon">subscriptions</mat-icon>
                <span>Subscriptions</span>
              </ng-template>
              <div class="tab-content">
                <app-subscriptions></app-subscriptions>
              </div>
            </mat-tab>

            <mat-tab>
              <ng-template mat-tab-label>
                <mat-icon class="tab-icon">history</mat-icon>
                <span>History</span>
              </ng-template>
              <div class="tab-content">
                <app-history></app-history>
              </div>
            </mat-tab>

          </mat-tab-group>
        </mat-card>

      </div>
    </div>
  </div>
</div>

<!-- STYLES FOR THIS COMPONENT ONLY (If your setup uses inline styles here) -->
<style>
  .app-root {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background-color: var(--mat-app-background-color, #fafafa);
  }

  .header-toolbar {
    position: sticky;
    top: 0;
    z-index: 1000;
  }

  .toolbar-container {
    display: flex;
    align-items: center;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 1rem;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-weight: 500;
    letter-spacing: 0.5px;
  }

  .spacer {
    flex: 1 1 auto;
  }

  .user-greeting {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.9rem;
    margin-right: 1rem;
    opacity: 0.9;
  }

  .main-container {
    flex: 1;
    padding: 2rem 1rem;
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
    box-sizing: border-box;
  }

  .auth-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 60vh;
  }

  .d-none {
    display: none !important;
  }

  .admin-section {
    margin-bottom: 2rem;
  }

  .add-card {
    margin-bottom: 2rem;
    border-radius: 8px;
  }

  .tabs-card {
    border-radius: 8px;
    overflow: hidden;
  }

  .tab-icon {
    margin-right: 0.5rem;
  }

  .tab-content {
    padding: 1.5rem;
  }

  @media (max-width: 600px) {
    .main-container {
      padding: 1rem 0.5rem;
    }
    .tab-content {
      padding: 1rem 0.5rem;
    }
  }
</style>
